services:
  monkeycode-panel:
    image: crpi-ijf5w3rczq2vwnig.cn-beijing.personal.cr.aliyuncs.com/mufenxu/my:${MONKEYCODE_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - ${MONKEYCODE_PANEL_ENV_FILE:-.env}
    environment:
      MONKEYCODE_PANEL_HOST: 0.0.0.0
      MONKEYCODE_PANEL_PORT: "4180"
      MONKEYCODE_DATA_DIR: /data
      MONKEYCODE_NODE_POOL_URL: http://node-pool-controller:4190
      MONKEYCODE_NODE_POOL_PUBLIC_URL: https://pool.pxyb.cn
    ports:
      - "127.0.0.1:4180:4180"
    volumes:
      - monkeycode-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4180/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  node-pool-controller:
    image: crpi-ijf5w3rczq2vwnig.cn-beijing.personal.cr.aliyuncs.com/mufenxu/my:${MONKEYCODE_NODE_POOL_IMAGE_TAG:-node-pool-latest}
    restart: unless-stopped
    init: true
    env_file:
      - ${MONKEYCODE_NODE_POOL_ENV_FILE:-.env}
    environment:
      MK_CONTROLLER_HOST: 0.0.0.0
      MK_CONTROLLER_PORT: "4190"
      MK_STATE_FILE: /data/state.json
      MK_WORKER_BUNDLE_FILE: /dist/monkeycode-node-pool.tar.gz
      MK_MANAGEMENT_URL: https://mk.pxyb.cn/#deployments
    ports:
      - "127.0.0.1:4190:4190"
    volumes:
      - node-pool-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4190/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  monkeycode-data:
  node-pool-data:
