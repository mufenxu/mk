name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: crpi-ijf5w3rczq2vwnig.cn-beijing.personal.cr.aliyuncs.com
  REGISTRY_USERNAME: mufenx
  IMAGE_NAME: crpi-ijf5w3rczq2vwnig.cn-beijing.personal.cr.aliyuncs.com/mufenxu/my

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Run tests in Docker
        run: docker build --target test --tag monkeycode-test:${GITHUB_SHA} .

      - name: Build production image
        shell: bash
        run: |
          image_name="${IMAGE_NAME,,}"
          short_sha="${GITHUB_SHA::12}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image_name}:sha-${short_sha}" \
            .
          echo "IMAGE_NAME_LOWER=${image_name}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${short_sha}" >> "${GITHUB_ENV}"

      - name: Smoke test production image
        shell: bash
        run: |
          cleanup() {
            docker rm --force monkeycode-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          master_key="$(openssl rand -base64 32)"
          docker run --detach \
            --name monkeycode-smoke \
            --publish 127.0.0.1:4180:4180 \
            --env MONKEYCODE_PANEL_PASSWORD=smoke-test-password-123456 \
            --env MONKEYCODE_MASTER_KEY="${master_key}" \
            --env MONKEYCODE_SECURE_COOKIE=false \
            --env MONKEYCODE_BROWSER_BRIDGE_ENABLED=false \
            "${IMAGE_NAME_LOWER}:sha-${SHORT_SHA}"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4180/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs monkeycode-smoke
          exit 1

      - name: Check Node Pool sources in Docker
        run: docker build --target test --tag monkeycode-node-pool-test:${GITHUB_SHA} services/node-pool

      - name: Build Node Pool production image
        shell: bash
        run: |
          node_pool_source_image="${IMAGE_NAME_LOWER}:node-pool-sha-${SHORT_SHA}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${node_pool_source_image}" \
            services/node-pool
          echo "NODE_POOL_SOURCE_IMAGE=${node_pool_source_image}" >> "${GITHUB_ENV}"

      - name: Smoke test Node Pool image
        shell: bash
        run: |
          cleanup() {
            docker rm --force monkeycode-node-pool-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name monkeycode-node-pool-smoke \
            --publish 127.0.0.1:4190:4190 \
            --env MK_ADMIN_TOKEN=smoke-test-admin-token-1234567890 \
            --env MK_WORKER_SECRET=smoke-test-worker-secret-12345678901234567890 \
            "${NODE_POOL_SOURCE_IMAGE}"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4190/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs monkeycode-node-pool-smoke
          exit 1

      - name: Check ACR credentials
        id: acr
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          if [[ -n "${ACR_PASSWORD}" ]]; then
            echo "can-publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "can-publish=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::ALIYUN_ACR_PASSWORD is not configured; skipping image publication."
          fi

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request' && steps.acr.outputs.can-publish == 'true'
        shell: bash
        env:
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: echo "${ACR_PASSWORD}" | docker login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Publish image
        if: github.event_name != 'pull_request' && steps.acr.outputs.can-publish == 'true'
        shell: bash
        run: |
          source_image="${IMAGE_NAME_LOWER}:sha-${SHORT_SHA}"
          docker push "${source_image}"
          docker push "${NODE_POOL_SOURCE_IMAGE}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            docker tag "${source_image}" "${IMAGE_NAME_LOWER}:latest"
            docker tag "${NODE_POOL_SOURCE_IMAGE}" "${IMAGE_NAME_LOWER}:node-pool-latest"
            docker push "${IMAGE_NAME_LOWER}:latest"
            docker push "${IMAGE_NAME_LOWER}:node-pool-latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            docker tag "${source_image}" "${IMAGE_NAME_LOWER}:${version}"
            docker tag "${NODE_POOL_SOURCE_IMAGE}" "${IMAGE_NAME_LOWER}:node-pool-${version}"
            docker push "${IMAGE_NAME_LOWER}:${version}"
            docker push "${IMAGE_NAME_LOWER}:node-pool-${version}"
          fi
